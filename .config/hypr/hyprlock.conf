# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Hyprlock config for < 1080p monitor resolutions
# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts
general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}
background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(0,0,0)
    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}
# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = $color13
    font_size = 48
    font_family = EB Garamond
    position = 0, -60
    halign = center
    valign = center
}
# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $color8
    font_size = 130
    font_family = EB Garamond
    position = 0, -250
    halign = center
    valign = top
}
# USER
label {
    monitor =
    text = $USER
    color = $color9
    font_size = 36
    font_family = EB Garamond
    position = 0, 275
    halign = center
    valign = bottom
}
# INPUT FIELD
input-field {
    monitor =
    size = 230, 70
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color8
    inner_color = rgba(255, 255, 255, 0.1)
    capslock_color = rgb(255,255,255)
    font_color = $color13
    fade_on_empty = false
    font_family = EB Garamond
    placeholder_text = <span foreground="##ffffff99"> Type Password</span>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}
# Keyboard LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = $color8
    font_size = 14
    font_family = EB Garamond
    position = 0, 70
    halign = center
    valign = bottom
}
